apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "davidnet-home-frontend.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "davidnet-home-frontend.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "davidnet-home-frontend.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "davidnet-home-frontend.name" . }}
    spec:
      # Allowed on node2 (Raspberry Pi, tainted node-class=statelessonly:NoSchedule): stateless, no PVC.
      tolerations:
        - key: node-class
          value: statelessonly
          effect: NoSchedule
          operator: Equal
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
          resources: {}
