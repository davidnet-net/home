apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "davidnet-account-frontend.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "davidnet-account-frontend.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "davidnet-account-frontend.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "davidnet-account-frontend.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
          resources: {}