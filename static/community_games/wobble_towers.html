                            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
                            ctx.strokeRect(p.x - bs / 2, p.y - bs / 2, bs, bs);
                        });
                        ctx.restore();
                    });
                }
                // Active piece
                if (opp.ap && !opp.dead) {
                    const ap = opp.ap;
                    ctx.save();
                    ctx.translate(ap.x, py + ap.y);
                    ctx.rotate(ap.a);
                    ctx.fillStyle = ap.color;
                    ctx.globalAlpha = 0.9;
                    const bs = BS * (ap.s || 1);
                    ap.parts.forEach(p => {
                        ctx.fillRect(p.x - bs / 2, p.y - bs / 2, bs, bs);
                        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                        ctx.strokeRect(p.x - bs / 2, p.y - bs / 2, bs, bs);
                    });
                    ctx.restore();
                }
                // Finish line for this opponent
                if (multiTargetM) {
                    const finY = py - (multiTargetM * BS);
                    ctx.globalAlpha = 0.85;
                    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath(); ctx.moveTo(-pw / 2 - 8, finY); ctx.lineTo(pw / 2 + 8, finY); ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 9px Fredoka';
                    ctx.textAlign = 'center'; ctx.globalAlpha = 1;
                    ctx.fillText(`🏁${multiTargetM}m`, 0, finY - 4);
                }
                ctx.restore();

                idx++;
            }

            ctx.restore(); // Restore from the outer setTransform(identity) at the start of drawOpponents
        }

        function drawOpponentLabels() {
            if (!isMultiplayer) return;
            const oppIds = Object.keys(opponents);
            if (oppIds.length === 0) return;

            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            const totalPlayers = oppIds.length + 1;
            const slotW = canvas.width / totalPlayers;

            let idx = 0;
            for (let id of oppIds) {
                const opp = opponents[id];
                let oppX = slotW * (idx + 1) + slotW * 0.5;

                // UI Label (screen-space)
                const labelY = canvas.height - 80;
                ctx.fillStyle = opp.dead ? 'rgba(239,68,68,0.9)' : 'rgba(30,41,59,0.95)';
                if (ctx.roundRect) ctx.roundRect(oppX - 65, labelY, 130, 42, 10);
                else ctx.fillRect(oppX - 65, labelY, 130, 42);
                ctx.fill();
                ctx.strokeStyle = opp.dead ? 'rgba(220,38,38,0.5)' : 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1.5;
                if (ctx.roundRect) ctx.roundRect(oppX - 65, labelY, 130, 42, 10);
                else ctx.strokeRect(oppX - 65, labelY, 130, 42);
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 13px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText(opp.name || 'Opponent', oppX, labelY + 17);
                ctx.font = '13px Fredoka';
                ctx.fillStyle = opp.dead ? '#fca5a5' : '#fbbf24';
                ctx.fillText((opp.h ? opp.h.toFixed(1) : '0.0') + 'm' + (opp.dead ? ' ☠️' : ''), oppX, labelY + 33);

                idx++;
            }

            // Draw our own label too (already in screen-space thanks to outer setTransform)
            if (!isSpectating) {
                const myX = platformX();
                const myLabelY = canvas.height - 80;
                ctx.fillStyle = 'rgba(30,41,59,0.95)';
                if (ctx.roundRect) ctx.roundRect(myX - 65, myLabelY, 130, 42, 10); else ctx.fillRect(myX - 65, myLabelY, 130, 42);
                ctx.fill();
                ctx.strokeStyle = 'rgba(56,189,248,0.8)';
                ctx.lineWidth = 2;
                if (ctx.roundRect) ctx.roundRect(myX - 65, myLabelY, 130, 42, 10); else ctx.strokeRect(myX - 65, myLabelY, 130, 42);
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 13px Fredoka';
                ctx.fillText('You (' + myName + ')', myX, myLabelY + 17);
                ctx.font = '13px Fredoka';
                ctx.fillStyle = '#fde047';
                ctx.fillText(towerHeightM.toFixed(1) + 'm', myX, myLabelY + 33);
            }

            ctx.restore(); // Restore from the outer setTransform(identity) at the start of drawOpponents
        }


        function drawBg() {
            // Sky color shifts redder in higher levels
            const lvl = currentLevel ? currentLevel.id : 1;
            const topCol = lvl >= 4 ? '#7c2d12' : lvl >= 3 ? '#0369a1' : '#0369a1';
            const midCol = lvl >= 4 ? '#ea580c' : lvl >= 3 ? '#0284c7' : '#38bdf8';
            const botCol = lvl >= 4 ? '#fed7aa' : '#bae6fd';
            const grad = ctx.createLinearGradient(0, cameraY, 0, cameraY + canvas.height);
            grad.addColorStop(0, topCol); grad.addColorStop(0.6, midCol); grad.addColorStop(1, botCol);
            ctx.fillStyle = grad; ctx.fillRect(0, cameraY, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            const co = (cameraY * 0.25) % 500;
            drawCloud(canvas.width * 0.15, cameraY + 160 + co, 55);
            drawCloud(canvas.width * 0.8, cameraY + 340 + co, 70);
            drawCloud(canvas.width * 0.45, cameraY + 520 + co, 60);
        }
        function drawCloud(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2); ctx.arc(x + r * .65, y - r * .2, r * .72, 0, Math.PI * 2); ctx.arc(x - r * .65, y - r * .2, r * .72, 0, Math.PI * 2);
            ctx.fill();
        }
        function drawPlatform() {
            if (!platformBody) return;
            ctx.save();
            const p = platformBody.position;

            // Pillar / base under platform
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(p.x - 30, p.y + 15, 60, 160, [0, 0, 14, 14]);
            else ctx.rect(p.x - 30, p.y + 15, 60, 160);
            ctx.fill();

            const parts = (platformBody.parts && platformBody.parts.length > 1) ? platformBody.parts.slice(1) : [platformBody];

            parts.forEach(part => {
                ctx.save();
                ctx.translate(part.position.x, part.position.y);
                ctx.rotate(part.angle);

                const w = Math.max(20, part.bounds.max.x - part.bounds.min.x);
                const h = Math.max(16, part.bounds.max.y - part.bounds.min.y);

                // Stone base
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-w / 2, -h / 2, w, h);

                // Grass top highlight
                ctx.fillStyle = '#16a34a';
                ctx.fillRect(-w / 2, -h / 2, w, 7);
                ctx.fillStyle = '#4ade80';
                ctx.fillRect(-w / 2, -h / 2, w, 2.5);

                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.strokeRect(-w / 2, -h / 2, w, h);

                ctx.restore();
            });

            ctx.restore();
        }
        function drawFinishLine() {
            // In multiplayer use the synced target; else derive from game mode
            let targetM = isMultiplayer ? (multiTargetM || 30) : null;
            if (!targetM && gameMode === 'race') targetM = 30;
            if (!targetM && gameMode === 'levels' && currentLevel) targetM = currentLevel.targetM;
            if (!targetM) return;
            const targetY = platformBody.position.y - 20 - (targetM * BS);
            ctx.save();
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.setLineDash([12, 7]);
            ctx.beginPath(); ctx.moveTo(0, targetY); ctx.lineTo(canvas.width, targetY); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 15px Fredoka';
            ctx.fillText(`FINISH (${targetM}m)`, 18, targetY - 8);
            ctx.restore();
        }
        function drawGhost() {
            if (!activePiece || !activePiece.localShape || isPaused || activePiece.isStatic) return;
            const origY = activePiece.position.y;
            const others = Composite.allBodies(world).filter(b => b !== activePiece);
            let dy = origY, limit = cameraY + canvas.height + 300;
            while (dy < limit) { dy += 5; Body.setPosition(activePiece, { x: activePiece.position.x, y: dy }); if (Query.collides(activePiece, others).length > 0) { dy -= 5; break; } }
            Body.setPosition(activePiece, { x: activePiece.position.x, y: origY });
            if (dy > origY + 12) {
                ctx.save(); ctx.translate(activePiece.position.x, activePiece.position.y + (dy - origY)); ctx.rotate(activePiece.angle);
                ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
                const s = activePiece.renderScale || 1;
                const bs = BS * s;
                activePiece.localShape.forEach(l => ctx.strokeRect(l.x - bs / 2 + 2 * s, l.y - bs / 2 + 2 * s, bs - 4 * s, bs - 4 * s));
                ctx.restore(); ctx.setLineDash([]);
            }
        }
        function drawBody(body) {
            if (!body.localShape) return;
            ctx.save(); ctx.translate(body.position.x, body.position.y); ctx.rotate(body.angle);
            const fill = body.pieceColor || '#38bdf8';
            let stroke = 'rgba(0,0,0,0.25)';
            if (body.customStyle === 'cement') stroke = '#475569';
            if (body.customStyle === 'anvil') stroke = '#18181b';
            if (body.customStyle === 'wood') stroke = '#78350f';

            const s = body.renderScale || 1;
            const bs = BS * s;

            // Locking flash: subtle white border pulse
            const locking = (body === activePiece && isLocking);
            const pulse = locking ? 0.5 + 0.5 * Math.sin(Date.now() * 0.025) : 0;

            body.localShape.forEach((l, i) => {
                const x = l.x, y = l.y;
                ctx.fillStyle = fill;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(x - bs / 2 + 1, y - bs / 2 + 1, bs - 2, bs - 2, 6 * s); else ctx.rect(x - bs / 2 + 1, y - bs / 2 + 1, bs - 2, bs - 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.22)';
                ctx.fillRect(x - bs / 2 + 3 * s, y - bs / 2 + 3 * s, bs - 6 * s, 5 * s);
                if (locking) {
                    ctx.strokeStyle = `rgba(255,255,255,${0.5 + pulse * 0.5})`;
                    ctx.lineWidth = (2 + pulse * 2) * s; ctx.stroke();
                } else {
                    ctx.strokeStyle = stroke; ctx.lineWidth = 1.5 * s; ctx.stroke();
                }
                if (i === 0 && body.customStyle !== 'wood') {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(x - 7 * s, y - 3 * s, 3.5 * s, 0, Math.PI * 2); ctx.arc(x + 7 * s, y - 3 * s, 3.5 * s, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#0f172a';
                    const eo = body === activePiece ? 1 : 0;
                    ctx.beginPath(); ctx.arc(x - 7 * s + eo, y - 3 * s + eo, 1.8 * s, 0, Math.PI * 2); ctx.arc(x + 7 * s + eo, y - 3 * s + eo, 1.8 * s, 0, Math.PI * 2); ctx.fill();
                }
            });
            ctx.restore();
        }
        function drawWater() {
            const wy = canvas.height - 28, t = Date.now() * .003;
            ctx.fillStyle = 'rgba(14,165,233,0.88)';
            ctx.beginPath(); ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x += 18) ctx.lineTo(x, wy + Math.sin(x * .025 + t) * 7);
            ctx.lineTo(canvas.width, canvas.height); ctx.closePath(); ctx.fill();
        }
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= p.decay;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // ─── Win / Game Over ──────────────────────────────────────────────────────────
        function triggerLevelWin() {
            if (!isPlaying) return;
            isPlaying = false;
            // Stars: 1 = done, 2 = no falls, 3 = no falls + no spells used
            const noFalls = lives >= 3;
            const noSpells = spells.cement >= 1 && spells.anvil >= 1 && spells.plank >= 1;
            const stars = noFalls && noSpells ? 3 : noFalls ? 2 : 1;
            const prev = levelStars[currentLevel.id] || 0;
            if (stars > prev) { levelStars[currentLevel.id] = stars; localStorage.setItem('wt_stars', JSON.stringify(levelStars)); }

            const modal = document.getElementById('gameOverModal');
            document.getElementById('modalTitle').innerText = '🎉 Level Complete!';
            document.getElementById('modalTitle').className = 'win';
            document.getElementById('modalBody').innerText = `${currentLevel.name}\nHeight: ${towerHeightM.toFixed(1)}m`;
            const sd = document.getElementById('levelStarsDisplay');
            sd.style.display = 'block'; sd.innerText = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
            const nb = document.getElementById('btnNextLevel');
            nb.style.display = 'block';
            modal.style.display = 'flex';
        }

        function triggerWin(msg) {
            if (!isPlaying) return;
            isPlaying = false;
            if (isHost) checkMultiplayerWin();
            document.getElementById('modalTitle').innerText = '🎉 Victory!';
            document.getElementById('modalTitle').className = 'win';
            document.getElementById('modalBody').innerText = `${msg}\nFinal height: ${towerHeightM.toFixed(1)}m`;
            document.getElementById('levelStarsDisplay').style.display = 'none';
            document.getElementById('btnNextLevel').style.display = 'none';
            document.getElementById('btnRetry').style.display = isMultiplayer ? 'none' : 'block';
            document.getElementById('gameOverModal').style.display = 'flex';
        }

        function gameOver(win, msg) {
            if (isMultiplayer && lobbyPlayers.length > 1) {
                if (isSpectating) return; // already spectating
                isSpectating = true;
                // Drop and lock the active piece immediately so it doesn't float around
                if (activePiece) { activePiece.ignoreGravity = false; activePiece = null; cancelLock(); }
                document.getElementById('modalTitle').innerText = win ? 'Finished!' : 'You Died!';
                document.getElementById('modalTitle').className = win ? 'win' : 'lose';
                document.getElementById('modalBody').innerText = msg + (win ? '' : '\nSpectating remaining players...');
                document.getElementById('gameOverModal').style.display = 'flex';
                document.getElementById('btnNextLevel').style.display = 'none';

                // Hide modal after a few seconds to watch the game
                setTimeout(() => { document.getElementById('gameOverModal').style.display = 'none'; }, 2500);
                if (isHost) checkMultiplayerWin();
                return; // Let gameLoop keep running for camera & opponents
            }

            if (!isPlaying) return;
            isPlaying = false;
            if (isHost) checkMultiplayerWin();
            const title = document.getElementById('modalTitle');
            title.innerText = win ? '🎉 Victory!' : '💀 Game Over!';
            title.className = win ? 'win' : 'lose';
            document.getElementById('modalBody').innerText = `${msg}\nFinal height: ${towerHeightM.toFixed(1)}m`;
            document.getElementById('levelStarsDisplay').style.display = 'none';
            document.getElementById('btnNextLevel').style.display = 'none';
            document.getElementById('btnRetry').style.display = isMultiplayer ? 'none' : 'block';
            document.getElementById('gameOverModal').style.display = 'flex';
        }

        function checkMultiplayerWin() {
            if (!isHost) return;
            let playingCount = 0;
            let lastAlive = null;
            let firstFinisher = null;

            if (isPlaying && !isSpectating && lives > 0) {
                playingCount++;
                lastAlive = myName;
            } else if (isSpectating && lives > 0) {
                if (!firstFinisher) firstFinisher = myName;
            }

            for (let id in opponents) {
                if (!opponents[id].dead) {
                    if (!opponents[id].finished) {
                        playingCount++;
                        lastAlive = opponents[id].name;
                    } else {
                        if (!firstFinisher) firstFinisher = opponents[id].name;
                    }
                }
            }

            if (playingCount <= 1 && lobbyPlayers.length > 1 && !window.winTimeout) {
                let winnerName = firstFinisher || lastAlive || 'Nobody';
                window.winTimeout = setTimeout(() => {
                    window.winTimeout = null;
                    mqttSend({ type: 'round_over', winnerName: winnerName });
                    triggerWin(winnerName + ' won the game!');
                    window.lobbyTimeout = setTimeout(() => { returnToLobby(); }, 4000);
                }, 2000);
            }
        }

        function restartCurrentGame() {
            // In multiplayer, don't let players restart on their own — host controls this via lobby
            if (isMultiplayer) return;
            if (gameMode === 'levels' && currentLevel) startInfiniteCampaign();
            else startGame(gameMode);
        }
        function returnToLobby() {
            isPlaying = false; cancelLock();
            isSpectating = false;
            if (window.winTimeout) { clearTimeout(window.winTimeout); window.winTimeout = null; }
            if (window.lobbyTimeout) { clearTimeout(window.lobbyTimeout); window.lobbyTimeout = null; }
            if (syncInterval) clearInterval(syncInterval);
            // Reset opponent states for the new round
            for (let id in opponents) { opponents[id].dead = false; opponents[id].finished = false; }
            document.getElementById('gameOverModal').style.display = 'none';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('startMenu').style.display = 'none';
            document.getElementById('levelStarsDisplay').style.display = 'none';
            document.getElementById('levelSelect').style.display = 'none';
            document.getElementById('mainModes').style.display = 'flex';
            World.clear(world);
            Engine.clear(engine);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBg(); drawWater();

            showLobbyUI(currentRoomCode);
            if (isHost) {
                document.getElementById('lobbyHostControls').style.display = 'flex';
                document.getElementById('lobbyClientStatus').style.display = 'none';
                broadcastLobbyUpdate();
            } else {
                document.getElementById('lobbyHostControls').style.display = 'none';
                document.getElementById('lobbyClientStatus').style.display = 'block';
                document.getElementById('lobbyClientStatus').innerText = 'Connected! Waiting for host...';
            }
        }

        function returnToMenu() {
            isPlaying = false; cancelLock();
            if (mqttClient) { try { mqttClient.end(true); } catch (e) { } mqttClient = null; }
            isMultiplayer = false; isHost = false; opponents = {}; lobbyPlayers = [];
            if (syncInterval) clearInterval(syncInterval);
            document.getElementById('gameOverModal').style.display = 'none';
            if (document.getElementById('roomModal')) document.getElementById('roomModal').style.display = 'none';
            if (document.getElementById('joinModal')) document.getElementById('joinModal').style.display = 'none';
            if (document.getElementById('lobbyModal')) document.getElementById('lobbyModal').style.display = 'none';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('levelStarsDisplay').style.display = 'none';
            document.getElementById('levelSelect').style.display = 'none';
            document.getElementById('mainModes').style.display = 'flex';
            document.getElementById('startMenu').style.display = 'flex';
            World.clear(world);
        }

        window.onload = () => {
            document.getElementById('hud').style.display = 'none';
            // Auto-fill room code from URL param (e.g. ?room=123456)
            const urlRoom = new URLSearchParams(window.location.search).get('room');
            if (urlRoom && /^\d{6}$/.test(urlRoom)) {
                const codeEl = document.getElementById('joinCodeInput');
                if (codeEl) codeEl.value = urlRoom;
            }
        };
    </script>
</body>
